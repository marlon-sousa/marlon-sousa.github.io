	<style>
		/* Palette copied from src/styles/global.css (loaded through an img tag, so it carries its own). */
		:root { --ink: #0f1219; --muted: #586994; --rule: #c8cfdc; --bar: #2337ff; }
		@media (prefers-color-scheme: dark) { :root { --ink: #f6f7f9; --muted: #9ca9c7; --rule: #3a4357; --bar: #97a4ff; } }
		text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
		.day { font-size: 12px; fill: var(--muted); text-anchor: middle; }
		.value { font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
		.note { font-size: 12px; fill: var(--ink); }
		.base { stroke: var(--rule); stroke-width: 1; }
		.marker { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
		.bar { fill: var(--bar); }
	</style>
