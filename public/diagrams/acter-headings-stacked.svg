<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 632" width="360" height="632" role="img" aria-labelledby="diagram-title">
	<title id="diagram-title">The same terminal session shown twice: once as plain output, once with each command as a heading</title>
	<desc>Above, a session where the two command lines look exactly like the output around them. Below, the same session in acter, where each command is a level two heading with its output beneath it.</desc>

	<!--
	  The narrow companion to acter-headings.svg, shown below 720px by the
	  picture element in the article. Same session, same thirteen rows, same
	  strings: the panels are stacked instead of side by side so each one gets
	  the full width of a phone screen and the terminal text stays readable.
	  Any wording change here has to be made in both files.
	-->
	<style>
		/*
		  Palette copied from src/styles/global.css. This file is loaded through
		  an img tag, so it cannot see the page's custom properties and has to
		  carry its own — including the dark mode the site follows from the
		  reader's system setting.
		*/
		:root {
			--panel: #f7f8fb;
			--rule: #e5e9f0;
			--ink: #0f1219;
			--body: #222939;
			--muted: #586994;
			--accent: #2337ff;
			--badge: #ffffff;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--panel: #171b26;
				--rule: #2c3344;
				--ink: #f6f7f9;
				--body: #e2e7f0;
				--muted: #9ca9c7;
				--accent: #97a4ff;
				--badge: #0f1219;
			}
		}
		.panel { fill: var(--panel); stroke: var(--rule); stroke-width: 1; }
		.label { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
		.caption { font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
		/* Leading and inner runs of spaces are load-bearing here: they are what
		   cargo and git actually print, and flattening them would make the top
		   panel look flatter than a real terminal is. */
		.mono { font: 11px ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace; fill: var(--body); white-space: pre; }
		.head { font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
		.tag { font: 700 9px ui-monospace, Consolas, monospace; fill: var(--accent); }
		.tagbox { fill: none; stroke: var(--accent); stroke-width: 1; }
		.dots { fill: var(--muted); }
		.trace-slow { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 2 3; fill: none; }
		.trace-fast { stroke: var(--accent); stroke-width: 1.5; fill: none; }
		.key { fill: var(--badge); stroke: var(--accent); stroke-width: 1.5; }
		.keytext { font: 700 10px system-ui, sans-serif; fill: var(--accent); }
	</style>

	<!-- ============================ TOP: today ============================= -->
	<text class="label" x="0" y="14">A terminal today</text>
	<rect class="panel" x="0.5" y="26" width="359" height="262" rx="8" />

	<g class="mono">
		<text xml:space="preserve" x="14" y="56">PS C:\projects\acter&gt; cargo build</text>
		<text xml:space="preserve" x="14" y="78">   Compiling proc-macro2 v1.0.95</text>
		<text xml:space="preserve" x="14" y="94">   Compiling serde v1.0.219</text>
		<text xml:space="preserve" x="14" y="110">   Compiling tauri-build v2.2.0</text>
		<text xml:space="preserve" x="14" y="126">warning: unused variable: `cx`</text>
		<text xml:space="preserve" x="14" y="142">  --&gt; src/buffer/render.rs:118:9</text>
		<text xml:space="preserve" x="14" y="179">PS C:\projects\acter&gt; git status</text>
		<text xml:space="preserve" x="14" y="201">On branch main</text>
		<text xml:space="preserve" x="14" y="217">Changes not staged for commit:</text>
		<text xml:space="preserve" x="14" y="233">        modified:   src/buffer/render.rs</text>
		<text xml:space="preserve" x="14" y="249">        modified:   src/main.rs</text>
	</g>
	<g class="dots">
		<circle cx="20" cy="152" r="1.3" /><circle cx="20" cy="157" r="1.3" /><circle cx="20" cy="162" r="1.3" />
		<circle cx="20" cy="259" r="1.3" /><circle cx="20" cy="264" r="1.3" /><circle cx="20" cy="269" r="1.3" />
	</g>

	<path class="trace-slow" d="M 342 52 L 342 183" />
	<text class="caption" x="0" y="306">Every line between them, one at a time.</text>

	<!-- ============================ BOTTOM: acter ========================== -->
	<text class="label" x="0" y="336">The same session in acter</text>
	<rect class="panel" x="0.5" y="348" width="359" height="262" rx="8" />

	<rect class="tagbox" x="14" y="366" width="21" height="14" rx="3" />
	<text class="tag" x="19" y="376">h2</text>
	<text class="head" x="43" y="378">cargo build</text>

	<rect class="tagbox" x="14" y="496" width="21" height="14" rx="3" />
	<text class="tag" x="19" y="506">h2</text>
	<text class="head" x="43" y="508">git status</text>

	<g class="mono">
		<text xml:space="preserve" x="26" y="400">   Compiling proc-macro2 v1.0.95</text>
		<text xml:space="preserve" x="26" y="416">   Compiling serde v1.0.219</text>
		<text xml:space="preserve" x="26" y="432">   Compiling tauri-build v2.2.0</text>
		<text xml:space="preserve" x="26" y="448">warning: unused variable: `cx`</text>
		<text xml:space="preserve" x="26" y="464">  --&gt; src/buffer/render.rs:118:9</text>
		<text xml:space="preserve" x="26" y="531">On branch main</text>
		<text xml:space="preserve" x="26" y="547">Changes not staged for commit:</text>
		<text xml:space="preserve" x="26" y="563">        modified:   src/buffer/render.rs</text>
		<text xml:space="preserve" x="26" y="579">        modified:   src/main.rs</text>
	</g>
	<g class="dots">
		<circle cx="32" cy="472" r="1.3" /><circle cx="32" cy="477" r="1.3" /><circle cx="32" cy="482" r="1.3" />
		<circle cx="32" cy="589" r="1.3" /><circle cx="32" cy="594" r="1.3" /><circle cx="32" cy="599" r="1.3" />
	</g>

	<path class="trace-fast" d="M 342 374 L 342 513" />
	<circle class="key" cx="342" cy="444" r="10" />
	<text class="keytext" x="338" y="448">H</text>
	<text class="caption" x="0" y="628">One keystroke, heading to heading.</text>
</svg>
