<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="The letter m in braille">
    <!-- A single braille cell showing the letter "m" (dots 1, 3 and 4).
         The three unraised dots are kept faint so the shape reads as a
         braille cell rather than as an arbitrary scatter of circles. -->
    <g class="raised">
        <circle cx="42" cy="26" r="15" />
        <circle cx="42" cy="102" r="15" />
        <circle cx="86" cy="26" r="15" />
    </g>
    <g class="flat">
        <circle cx="42" cy="64" r="15" />
        <circle cx="86" cy="64" r="15" />
        <circle cx="86" cy="102" r="15" />
    </g>
    <style>
        .raised { fill: #0f1219; }
        .flat { fill: #0f1219; opacity: 0.18; }
        @media (prefers-color-scheme: dark) {
            .raised { fill: #fff; }
            .flat { fill: #fff; opacity: 0.22; }
        }
    </style>
</svg>
