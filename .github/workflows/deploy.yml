name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Lets the site be taken down or restored from the Actions tab, on any device,
  # with no local checkout and nothing installed. See "Taking the site down" in
  # README.md.
  workflow_dispatch:
    inputs:
      availability:
        description: 'Site availability'
        type: choice
        default: 'leave unchanged'
        options:
          - 'leave unchanged'
          - 'take the site down'
          - 'bring the site back'

# `contents: write` is needed only so the availability input above can commit the
# MAINTENANCE.md flag; every other path here only reads the repository.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The switch is committed rather than held in workflow state, so the site's
      # availability is visible in the repository and survives later deploys.
      # Going live again is therefore also just reverting this commit.
      - name: Apply the availability choice
        if: github.event_name == 'workflow_dispatch' && inputs.availability != 'leave unchanged'
        run: |
          set -euo pipefail
          if [ "${{ inputs.availability }}" = "take the site down" ]; then
            # Only write a default message if there is no file yet, so a message
            # written by hand is not silently replaced by this one.
            if [ ! -f MAINTENANCE.md ]; then
              printf 'Created by the Deploy workflow. Delete this file to bring the site back.\n' > MAINTENANCE.md
            fi
            git add MAINTENANCE.md
            message="Take the site down"
          else
            # --ignore-unmatch so that asking for a site that is already live is a
            # no-op rather than a failed run that skips the deploy.
            git rm -q -f --ignore-unmatch MAINTENANCE.md
            message="Bring the site back"
          fi
          if git diff --cached --quiet; then
            echo "::notice::Already in the requested state; nothing to commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "$message"
            git push
          fi

      # The kill switch. While MAINTENANCE.md exists in the repository root the
      # whole site is replaced by a single "temporarily offline" page. Presence is
      # the trigger, not the contents, so there is no syntax to get wrong — and
      # this path never runs `astro build`, so it still works when the site itself
      # is what is broken.
      - name: Check for maintenance mode
        id: maintenance
        run: |
          if [ -f MAINTENANCE.md ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::MAINTENANCE.md is present - publishing the offline page instead of the site."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the maintenance page
        if: steps.maintenance.outputs.enabled == 'true'
        run: node scripts/maintenance-page.mjs

      - name: Upload the maintenance page
        if: steps.maintenance.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Rust series snippets are not pasted into the articles; they are read from
      # tagged commits in postres at build time (plugins/remark-code-include.mjs).
      # Full history, because a tag can be any commit. It sits inside the
      # workspace, where checkout can put it, and the plugin is told where.
      - name: Check out postres for code includes
        if: steps.maintenance.outputs.enabled == 'false'
        uses: actions/checkout@v4
        with:
          repository: marlon-sousa/postres
          path: external/postres
          fetch-depth: 0

      # What gets published is what passed the gate. `npm run verify` is the same
      # command run locally before a push — type check, contrast, a forced build,
      # then accessibility, layout and language checks over the built pages — and
      # the `dist/` it leaves behind is the one uploaded. A site that fails any of
      # it is not deployed, and the live site stays on its last good version.
      - name: Set up Node
        if: steps.maintenance.outputs.enabled == 'false'
        uses: actions/setup-node@v4
        with:
          # Keep in step with package.json's engines field. Astro 7 refuses
          # anything older than 22.12 with a hard exit before any page is built.
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.maintenance.outputs.enabled == 'false'
        run: npm ci

      # The accessibility, layout and language checks drive a real browser.
      - name: Install the browser the checks use
        if: steps.maintenance.outputs.enabled == 'false'
        run: npx playwright install --with-deps chromium

      - name: Verify, which also builds the site
        if: steps.maintenance.outputs.enabled == 'false'
        run: npm run verify
        env:
          # The Releases page queries the GitHub API at build time. Without a
          # token, runners share an IP against a 60 requests/hour limit and the
          # page quietly falls back to the versions in src/data/projects.ts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_REPO_POSTRES: ${{ github.workspace }}/external/postres

      - name: Upload the site
        if: steps.maintenance.outputs.enabled == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The same gate on Windows, in parallel with the build above. It publishes
  # nothing — the site that goes out is the one built on Linux — but the deploy
  # waits for it, so a page that only breaks under one operating system's fonts
  # or paths is caught wherever it breaks. The first Linux run found two such
  # things that Windows had been hiding; this keeps the reverse from happening.
  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mirrors the maintenance decision in `build` without waiting for it: no
      # gate is needed when the offline page is what will be published. Asking to
      # bring the site back runs the gate even though the file is still in this
      # checkout, because `build` removes it before building.
      - name: Decide whether there is a site to check
        id: maintenance
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.availability }}" = "take the site down" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.availability }}" = "bring the site back" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -f MAINTENANCE.md ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out postres for code includes
        if: steps.maintenance.outputs.enabled == 'false'
        uses: actions/checkout@v4
        with:
          repository: marlon-sousa/postres
          path: external/postres
          fetch-depth: 0

      - name: Set up Node
        if: steps.maintenance.outputs.enabled == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.maintenance.outputs.enabled == 'false'
        run: npm ci

      # No --with-deps: that installs Linux system packages, and Windows has
      # nothing to add.
      - name: Install the browser the checks use
        if: steps.maintenance.outputs.enabled == 'false'
        run: npx playwright install chromium

      - name: Verify
        if: steps.maintenance.outputs.enabled == 'false'
        run: npm run verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_REPO_POSTRES: ${{ github.workspace }}/external/postres

  deploy:
    needs: [build, verify-windows]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
